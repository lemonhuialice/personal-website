  const state={tab:'executive',query:'',category:'全部',priority:'全部',service:95,leadDelta:0};
  const colors={'健康':'#40c4aa','需补货':'#e9a93f','积压':'#8a7ff0','缺货':'#ef6d65'};
  const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
  const num=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0}).format(n||0);
  const pct=(n,d=1)=>`${((n||0)*100).toFixed(d)}%`;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const metric=(label,value,delta,foot,tone='')=>`<article class="metric ${tone}"><label>${label}</label><strong>${value}</strong><span class="delta">${delta}</span><small>${foot}</small></article>`;
  function donut(){let cursor=0;const total=DATA.statusCounts.reduce((a,x)=>a+x.value,0);const stops=DATA.statusCounts.map(x=>{const a=cursor;cursor+=x.value/total*100;return `${colors[x.name]} ${a}% ${cursor}%`}).join(',');return `<div class="donut-box"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><strong>${total}</strong><span>重点 SKU</span></div></div><div class="legend">${DATA.statusCounts.map(x=>`<div><i style="background:${colors[x.name]}"></i><span>${x.name}</span><strong>${x.value}</strong></div>`).join('')}</div></div>`}
  function compare(){const old=DATA.policyComparison.find(x=>x.policy==='旧策略'),next=DATA.policyComparison.find(x=>x.policy==='优化策略');const rows=[['Fill Rate',old.fill_rate*100,next.fill_rate*100,'%',100],['缺货率',old.stockout_rate*100,next.stockout_rate*100,'%',Math.max(old.stockout_rate,next.stockout_rate)*120],['平均库存金额',old.avg_inventory_value,next.avg_inventory_value,'',Math.max(old.avg_inventory_value,next.avg_inventory_value)*1.08]];return rows.map(r=>`<div class="compare-row"><div class="compare-label"><b>${r[0]}</b><small>${r[3]?`${r[1].toFixed(1)} → ${r[2].toFixed(1)}${r[3]}`:`${money(r[1])} → ${money(r[2])}`}</small></div><div class="bar-pair"><i class="bar-old" style="width:${Math.max(4,r[1]/r[4]*100)}%"></i><i class="bar-new" style="width:${Math.max(4,r[2]/r[4]*100)}%"></i></div></div>`).join('')}
  function executive(){const s=DATA.summary;return `<section class="hero"><div><span class="kicker">INVENTORY CONTROL TOWER</span><h1>把库存问题，<br>变成今天的补货动作。</h1><p>真实Olist订单与卖家履约时效 · 300个重点SKU · 180天策略回测</p></div><aside class="callout"><span>今日决策摘要</span><strong>${s.current_inventory.replenishment_skus}个SKU</strong><p>进入补货队列，建议采购 <b>${num(s.current_inventory.recommended_order_units)}</b> 件</p><button onclick="go('replenishment')">查看行动清单 →</button></aside></section><section class="metrics">${metric('Fill Rate',pct(s.impact.optimized_fill_rate),`+${s.impact.fill_rate_change_pp.toFixed(2)}pp`,'相较旧策略')}${metric('缺货率',pct(s.impact.optimized_stockout_rate),`-${(s.impact.stockout_reduction_pct*100).toFixed(1)}%`,'未满足需求 / 总需求','coral')}${metric('平均库存金额',money(s.impact.optimized_inventory_value),`投入${(s.impact.inventory_value_change_pct*100).toFixed(1)}%`,'以库存换服务','violet')}${metric('相关成本',money(s.impact.optimized_cost),`${(s.impact.cost_change_pct*100).toFixed(1)}%`,'持有 + 订货 + 缺货','gold')}</section><section class="grid2"><article class="panel"><div class="panel-head"><div><span>POLICY IMPACT</span><h2>新旧补货策略对比</h2></div><em>180天回测</em></div>${compare()}</article><article class="panel"><div class="panel-head"><div><span>INVENTORY HEALTH</span><h2>当前库存结构</h2></div><em>基线期末</em></div>${donut()}</article></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><span>PORTFOLIO FLOW</span><h2>近60日需求与优化后库存</h2></div><em>单位：件</em></div><div class="grid2"><div class="chart-wrap"><canvas id="demandChart"></canvas></div><div class="chart-wrap"><canvas id="stockChart"></canvas></div></div><div class="chart-note"><span>组合需求</span><span>优化策略期末在手</span></div></section>`}
  function health(){const max=Math.max(...DATA.abcSummary.map(x=>x.revenue));return `<section class="intro"><span>HEALTH DIAGNOSTICS</span><h1>库存健康不是一个数字，<br>而是一组不同的处置动作。</h1><p>缺货要抢救，积压要止损，A类SKU要优先。</p></section><section class="grid2"><article class="panel"><div class="panel-head"><div><span>STATUS MIX</span><h2>健康状态分布</h2></div></div>${donut()}</article><article class="panel"><div class="panel-head"><div><span>ABC SEGMENTATION</span><h2>销售贡献与库存占用</h2></div></div><div class="abc-list">${DATA.abcSummary.map(x=>`<div class="abc-row"><b>${x.abc_class}</b><span class="abc-track"><i style="width:${x.revenue/max*100}%"></i></span><p><b>${x.skuCount} SKU</b><small>${money(x.revenue)} 年销售额</small></p></div>`).join('')}</div></article></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><span>ROOT CAUSE</span><h2>异常根因与下一步</h2></div><em>${DATA.rootCauses.length}条诊断</em></div><div class="cards">${DATA.rootCauses.slice(0,16).map(x=>`<article class="issue-card"><header><span class="pill ${x.status}">${x.status}</span><b>${esc(x.item_id)}</b></header><h3>${esc(x.root_cause)}</h3><p>${esc(x.recommended_action)}</p><small>${x.priority} · 建议 ${num(x.suggested_order_qty)} 件</small></article>`).join('')}</div></section>`}
  function forecast(){const s=DATA.summary.forecast;const mix=Object.entries(s.best_model_mix).sort((a,b)=>b[1]-a[1]);return `<section class="intro"><span>DEMAND INTELLIGENCE</span><h1>先承认需求难预测，<br>再让决策对误差更稳健。</h1><p>逐SKU时间留出验证，使用WAPE选择可解释模型。</p></section><section class="metrics three">${metric('28天预测需求',num(s.forecast_28d_units),'未来4周','组合预测件数')}${metric('组合WAPE',pct(s.weighted_wape),'间歇需求','误差较高','coral')}${metric('建模SKU',num(DATA.summary.portfolio.sku_count),'Top SKU','按近365日销售额','violet')}</section><section class="grid2"><article class="panel"><div class="panel-head"><div><span>ACTUAL + FORECAST</span><h2>历史56天 + 未来28天组合需求</h2></div><em>分界线后为预测</em></div><div class="chart-wrap tall"><canvas id="forecastChart"></canvas></div></article><article class="panel"><div class="panel-head"><div><span>MODEL CHAMPIONS</span><h2>逐SKU最优模型构成</h2></div></div><div class="model-list">${mix.map((x,i)=>`<div><i>${String(i+1).padStart(2,'0')}</i><span>${esc(x[0])}</span><strong>${x[1]} SKU</strong></div>`).join('')}</div><p class="note"><b>分析师解读</b>${pct(s.weighted_wape)} WAPE反映了Olist商品的高度间歇需求。项目加入Croston方法，并用SKU级安全库存吸收剩余不确定性。</p></article></section>`}
  function filteredRows(){return DATA.recommendations.filter(r=>(!state.query||r.item_id.toLowerCase().includes(state.query.toLowerCase()))&&(state.category==='全部'||r.cat_id===state.category)&&(state.priority==='全部'||r.priority===state.priority))}
  function rowsHtml(rows){return rows.map(r=>`<tr><td class="sku-cell"><span class="priority ${r.priority}">${r.priority}</span><b>${esc(r.item_id)}</b><small>${esc(r.cat_id)}</small></td><td><span class="pill ${r.status}">${r.status}</span></td><td><b>${r.abc_class}${r.xyz_class}</b></td><td>${num(r.current_on_hand)} / ${num(r.in_transit)}</td><td>${r.days_of_supply==null?'—':Number(r.days_of_supply).toFixed(1)+'天'}</td><td>${r.lead_time_days}天</td><td>${num(r.reorder_point)}</td><td><strong class="order">${num(r.suggested_order_qty)}</strong></td></tr>`).join('')}
  function replenishment(){const s=DATA.summary.current_inventory;const cats=[...new Set(DATA.recommendations.map(r=>r.cat_id))].sort();const rows=filteredRows();return `<section class="intro"><span>ACTION CENTER</span><h1>这不是风险清单，<br>这是今天可以下单的工作台。</h1><p>数量已考虑在手、在途、ROP、目标库存与箱规。</p></section><section class="action-banner"><div><span>建议补货</span><strong>${s.replenishment_skus}</strong><small>个SKU</small></div><div><span>建议数量</span><strong>${num(s.recommended_order_units)}</strong><small>件</small></div><div><span>紧急缺货</span><strong>${s.status_counts.缺货}</strong><small>个SKU</small></div><button class="dark-button" onclick="downloadCsv()">导出当前清单 ↓</button></section><section class="panel table-panel"><div class="filters"><input id="search" value="${esc(state.query)}" placeholder="搜索SKU…" aria-label="搜索SKU"><select id="category"><option>全部</option>${cats.map(x=>`<option ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="priority"><option>全部</option>${['P0','P1','P2','P3','P4'].map(x=>`<option ${state.priority===x?'selected':''}>${x}</option>`).join('')}</select><output id="count">${rows.length}条结果</output></div><div class="table-scroll"><table><thead><tr><th>优先级 / SKU</th><th>状态</th><th>ABC·XYZ</th><th>在手 / 在途</th><th>覆盖天数</th><th>Lead Time</th><th>ROP</th><th>建议补货</th></tr></thead><tbody id="rows">${rowsHtml(rows)}</tbody></table></div></section>`}
  function scenario(){return `<section class="intro"><span>SCENARIO LAB</span><h1>服务水平越高，<br>不是免费的。</h1><p>调整参数，观察安全库存、采购量、资金占用与服务水平的权衡。</p></section><section class="scenario"><article class="controls"><span>01 · SERVICE LEVEL</span><div class="range-label"><h2>目标服务水平</h2><strong id="serviceLabel">${state.service}%</strong></div><input id="service" type="range" min="90" max="99" step="1" value="${state.service}"><div class="ticks"><small>90%</small><small>95%</small><small>97%</small><small>99%</small></div><hr><span>02 · LEAD TIME</span><div class="range-label"><h2>供应提前期变化</h2><strong id="leadLabel">${state.leadDelta>0?'+':''}${state.leadDelta}天</strong></div><input id="lead" type="range" min="-3" max="5" step="1" value="${state.leadDelta}"><div class="ticks"><small>-3天</small><small>当前</small><small>+5天</small></div><p>计算基于300个重点SKU的需求波动、平均提前期和库存位置，用于策略讨论，不代替供应商确认。</p></article><article class="scenario-output"><div class="panel-head"><div><span>MODELED OUTCOME</span><h2 id="scenarioTitle"></h2></div><em>即时重算</em></div><div class="scenario-metrics"><div><span>安全库存</span><strong id="safety"></strong><small>件</small></div><div><span>建议采购</span><strong id="units"></strong><small>件</small></div><div><span>新增资金占用</span><strong id="investment"></strong><small>按单位成本</small></div><div><span>模型Fill Rate</span><strong id="fill"></strong><small>方向性估算</small></div></div><div class="trade"><div><span>服务水平</span><i><b id="serviceBar"></b></i></div><div><span>资金效率</span><i><b id="cashBar" class="violet"></b></i></div></div><div class="rec-note"><b id="decision"></b><p id="decisionText"></p></div></article></section>`}
  function drawLine(id,values,color,split=null){const c=document.getElementById(id);if(!c)return;const dpr=window.devicePixelRatio||1;const rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=rect.height,p=16;const min=Math.min(...values),max=Math.max(...values),span=max-min||1;x.strokeStyle='#e6e9e3';x.lineWidth=1;for(let i=0;i<4;i++){const y=p+(h-2*p)*i/3;x.beginPath();x.moveTo(p,y);x.lineTo(w-p,y);x.stroke()}const pts=values.map((v,i)=>[p+(w-2*p)*i/Math.max(1,values.length-1),h-p-(h-2*p)*(v-min)/span]);x.beginPath();pts.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.lineTo(pts.at(-1)[0],h-p);x.lineTo(pts[0][0],h-p);x.closePath();const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,color+'45');g.addColorStop(1,color+'00');x.fillStyle=g;x.fill();x.beginPath();pts.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.strokeStyle=color;x.lineWidth=3;x.lineJoin='round';x.lineCap='round';x.stroke();if(split!==null){const sx=p+(w-2*p)*split/(values.length-1);x.setLineDash([5,5]);x.strokeStyle='#ef6d65';x.beginPath();x.moveTo(sx,p);x.lineTo(sx,h-p);x.stroke();x.setLineDash([])}}
  function updateTable(){const rows=filteredRows();document.getElementById('rows').innerHTML=rowsHtml(rows);document.getElementById('count').textContent=`${rows.length}条结果`}
  function snapService(v){v=Number(v);return v<=92?90:v<=96?95:v<=98?97:99}
  function updateScenario(){const base=DATA.scenario.find(x=>x.service_level===state.service)||DATA.scenario[1];const factor=Math.sqrt(Math.max(.4,(10+state.leadDelta)/10));const units=Math.round(base.recommended_order_units*factor),safety=Math.round(base.safety_stock_units*factor),investment=base.incremental_inventory_value*factor,fill=Math.max(80,Math.min(99.9,base.modeled_fill_rate-Math.max(0,state.leadDelta)*.25+Math.max(0,-state.leadDelta)*.08));document.getElementById('serviceLabel').textContent=state.service+'%';document.getElementById('leadLabel').textContent=(state.leadDelta>0?'+':'')+state.leadDelta+'天';document.getElementById('scenarioTitle').textContent=state.service+'%服务水平方案';document.getElementById('safety').textContent=num(safety);document.getElementById('units').textContent=num(units);document.getElementById('investment').textContent=money(investment);document.getElementById('fill').textContent=fill.toFixed(1)+'%';document.getElementById('serviceBar').style.width=fill+'%';document.getElementById('cashBar').style.width=Math.max(12,100-investment/DATA.scenario[3].incremental_inventory_value*70)+'%';const recommend=state.service===95&&state.leadDelta<=0;document.getElementById('decision').textContent=recommend?'建议采用':'需要管理层权衡';document.getElementById('decisionText').textContent=state.service>=99?'99%方案显著增加安全库存，建议仅用于高毛利AX SKU。':state.service<=90?'90%方案资金占用最低，但缺货容忍度较高。':'95%是当前组合的基准方案；A类与高波动SKU可以单独提高服务水平。'}
  function downloadCsv(){const rows=filteredRows();if(!rows.length)return;const headers=Object.keys(rows[0]);const csv=[headers.join(','),...rows.map(r=>headers.map(h=>JSON.stringify(r[h]??'')).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='今日补货建议.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function bind(){if(state.tab==='executive'){drawLine('demandChart',DATA.inventoryTrend.demand,'#40c4aa');drawLine('stockChart',DATA.inventoryTrend.onHand,'#8a7ff0')}if(state.tab==='forecast'){drawLine('forecastChart',[...DATA.demandTrend.actual,...DATA.demandTrend.forecast],'#40c4aa',DATA.demandTrend.actual.length-1)}if(state.tab==='replenishment'){document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;updateTable()});document.getElementById('category').addEventListener('change',e=>{state.category=e.target.value;updateTable()});document.getElementById('priority').addEventListener('change',e=>{state.priority=e.target.value;updateTable()})}if(state.tab==='scenario'){document.getElementById('service').addEventListener('input',e=>{state.service=snapService(e.target.value);e.target.value=state.service;updateScenario()});document.getElementById('lead').addEventListener('input',e=>{state.leadDelta=Number(e.target.value);updateScenario()});updateScenario()}}
  function render(){const views={executive,health,forecast,replenishment,scenario};document.getElementById('app').innerHTML=views[state.tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));bind();window.scrollTo({top:0,behavior:'smooth'})}
  function go(tab){state.tab=tab;render()}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));window.addEventListener('resize',()=>{if(state.tab==='executive'||state.tab==='forecast')bind()});render();
  </script>
</body>
</html>
